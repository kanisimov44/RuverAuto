<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ (content.header_desc if content else '')|meta }}{% endblock %}">
  <link rel="canonical" href="{{ canonical_url }}">

  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:site_name" content="{{ brand }}">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ canonical_url }}">
  {%- block og_image %}
  {%- if content and content.logo %}
  <meta property="og:image" content="{{ url_for('static', path='uploads/' + content.logo) }}">
  {%- endif %}
  {%- endblock %}

  <link rel="icon" href="{{ url_for('static', path='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
  <style>:root { --accent: {{ accent_color }}; }</style>
  <script>
    // Тема применяется до отрисовки, чтобы страница не мигала светлым фоном
    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  {% include "partials/header.html" %}

  <main id="main" class="main">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
</body>
</html>
